plugins {
    id 'numen-plugin'
    id 'org.spongepowered.gradle.vanilla' version '0.2.1-SNAPSHOT'
}

// 只写原版 MC 与 numen api,三个加载器都能跑:编译对着原版(VanillaGradle,与 api/common
// 同一条路),加载器的类物理上不在类路径上,想用也编译不过。
//
// 这个联动不需要 YsmHost 那样的宿主接口:任务书与进度都是磁盘上的 SNBT 文本,
// 从 <config>/ftbquests/quests 到 <world>/ftbquests/<队伍id>.snbt,三个加载器上
// 一模一样(两个位置都是从 FTB Quests 自己的 ServerQuestFile 里核实来的)。
minecraft { version(minecraft_version) }

dependencies {
    // 瘦 api jar 取跨加载器那份:与本模块一样只有原版 MC 的类型
    compileOnly files(project(':api:common').tasks.named('apiJar'))

    // 单测:解析与"下一步能做什么"的判断全是纯函数——不碰 MC、不碰 FTB——所以它们
    // 能在没有游戏环境的地方跑。这正是选"读 SNBT"而不是"反射它的 API"换来的东西。
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') { useJUnitPlatform() }

// 编译期类路径上<b>没有</b> FTB Quests,也没有它的 maven 坐标:任务书是文本,
// 读它一个类都不用引用。目标模组不在时这个模块一个类都不会被加载,见各加载器 core
// 的 Builtin 那道闸。
