plugins {
    id 'api-common'
}

configurations {
    commonJava{
        canBeResolved = true
    }
    commonClientJava{
        canBeResolved = true
    }
    commonResources{
        canBeResolved = true
    }
}

dependencies {
    // 消费面契约:NumenTool 继承 ai 的 IToolSpec,编译期消费者(如 core 的
    // loader 模块)需要看见 ai 的类型。发行 jar 已把 ai 的类平铺进来(见下方
    // jar 块),运行时自含,这条声明只服务编译期与 pom 的如实陈述。
    api project(':ai')
    // UI 组件库(纯 JVM)同理:屏幕组装层引用 widget/令牌类型,编译期要看得见;
    // 发行 jar 里的类由下方 jar 块平铺进来。
    api project(':ui')
    compileOnly(project(':api:common')) {
        def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }
    commonJava project(path: ':api:common', configuration: 'commonJava')
    commonClientJava project(path: ':api:common', configuration: 'commonClientJava')
    commonResources project(path: ':api:common', configuration: 'commonResources')
}

// 加载器把 common 的主源码与客户端源码一起编进自己的 jar:分源码集的
// 保护发生在 common 的编译期(主源码集看不见客户端类),发行 jar 照旧
// 全量——服务端不会去加载客户端类,因为主源码集里已经没有任何引用。
tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
    dependsOn(configurations.commonClientJava)
    source(configurations.commonClientJava)
}

processResources {
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

tasks.named('javadoc', Javadoc).configure {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
    dependsOn(configurations.commonClientJava)
    source(configurations.commonClientJava)
}

tasks.named('sourcesJar', Jar) {
    dependsOn(configurations.commonJava)
    from(configurations.commonJava)
    dependsOn(configurations.commonClientJava)
    from(configurations.commonClientJava)
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
    from({ project(':ai').sourceSets.main.allSource })
    from({ project(':ui').sourceSets.main.allSource })
}

// numen-ai 的类平铺进加载器发行 jar——http/prompt 从 common 源码集迁去 ai
// 模块后,加载器不再从源码把它们编进来,这里补回,发行 jar 内容与拆分前一致。
tasks.named('jar', Jar) {
    from({ project(':ai').sourceSets.main.output })
    from({ project(':ui').sourceSets.main.output })
}

// ── datagen 产物不在仓库里(.gitignore: **/generated/),而语言文件只由它产出 ──────
//
// 少了它,打出来的包在界面上显示的不是中文,而是 numen.bubble.thinking / numen.tab.chat
// 这样的裸键 —— 而且没有任何报错:语言文件缺了,原版 I18n 就原样把键吐出来。
// CI 是「先 datagenAll 再 build」(见 .github/workflows/publish.yml),但本地直接 build 的人
// 不少(作者自己也是这么踩进来的),于是这里两道:
//   1. 本机还没有产物 → 把 datagen 拉进打包(一次性开销);
//   2. 打完再验一次 jar 里到底有没有语言文件 —— 缺了当场把构建判死。
// 形状照抄 core/forge 那条 refmap 绞索:坏包不许静默出门。
def datagenTask = tasks.findByName('runDatagen') ?: tasks.findByName('Data')
if (datagenTask != null && !file('src/generated/resources').isDirectory()) {
    tasks.matching { it.name == 'jar' || it.name == 'remapJar' }.configureEach { dependsOn datagenTask }
}
tasks.named('jar', Jar) {
    doLast {
        def zf = new java.util.zip.ZipFile(archiveFile.get().asFile)
        try {
            boolean hasLang = zf.entries().any {
                it.name ==~ /assets\/[^\/]+\/lang\/(en_us|zh_cn)\.json/
            }
            if (!hasLang) {
                throw new GradleException("语言文件不在 ${archiveFile.get().asFile.name} 里 —— "
                        + "界面会显示 numen.* 裸键。datagen 的产物不在仓库里(gitignore),先跑 "
                        + "`./gradlew datagenAll`(或重新执行本任务:缺产物时它会自动先跑一次 datagen)。")
            }
        } finally {
            zf.close()
        }
    }
}
