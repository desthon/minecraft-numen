plugins {
    id 'multiloader-common'
}

configurations {
    commonJava{
        canBeResolved = true
    }
    commonResources{
        canBeResolved = true
    }
}

dependencies {
    compileOnly(project(':core:common')) {
        def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }
    commonJava project(path: ':core:common', configuration: 'commonJava')
    commonResources project(path: ':core:common', configuration: 'commonResources')
}

tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

processResources {
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

tasks.named('javadoc', Javadoc).configure {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

tasks.named('sourcesJar', Jar) {
    dependsOn(configurations.commonJava)
    from(configurations.commonJava)
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

// ── datagen 产物不在仓库里(.gitignore: **/generated/)──────────────────────────
//
// core 这边产出的是标签(do_not_break 里的床/门、垫路料标签……),少了它们规矩会静默失效:
// 她会拆主人的床、找不到任何可垫的方块,而日志里一句异常都没有。
// 与 api 那边同一条规矩:缺产物就把 datagen 拉进构建,别让空标签的包混出去。
// 条件取「不存在或空」:被中断的 datagen 会留下空目录,只判存在的话自动补跑不触发,
// 而把关那一步照样会拦 —— 于是每次构建都失败,却不肯自己跑一次 datagen。
// 同 api 侧:判据要问"东西在不在",不是"目录空不空"(被中断的 datagen 只剩 .cache/)。
def generatedReady = { -> file('src/generated/resources/data').isDirectory() }
// 任务名要等到 afterEvaluate 才查得到:loom / ForgeGradle 的 datagen 运行配置是在
// 各自的 build.gradle 后段才注册的,而本脚本是 plugins{} 块里第一个被应用的。
afterEvaluate {
    def datagenTask = tasks.findByName('runDatagen') ?: tasks.findByName('Data')
    if (datagenTask != null && !generatedReady()) {
        tasks.matching { it.name == 'jar' || it.name == 'remapJar' }.configureEach { dependsOn datagenTask }
    }
}
tasks.named('jar', Jar) {
    doFirst {
        def generated = file('src/generated/resources')
        if (!generated.isDirectory() || !generated.listFiles()) {
            throw new GradleException("datagen 产物缺失(${generated}) —— 打出来的包里标签会是空的。"
                    + "先跑 `./gradlew datagenAll`,或重新执行本任务(缺产物时它会自动先跑 datagen)。")
        }
    }
}
