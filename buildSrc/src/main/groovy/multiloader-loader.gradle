plugins {
    id 'multiloader-common'
}

configurations {
    commonJava{
        canBeResolved = true
    }
    commonResources{
        canBeResolved = true
    }
}

dependencies {
    compileOnly(project(':core:common')) {
        def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }
    commonJava project(path: ':core:common', configuration: 'commonJava')
    commonResources project(path: ':core:common', configuration: 'commonResources')
}

tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

processResources {
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

tasks.named('javadoc', Javadoc).configure {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

tasks.named('sourcesJar', Jar) {
    dependsOn(configurations.commonJava)
    from(configurations.commonJava)
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

// ── datagen 产物不在仓库里(.gitignore: **/generated/)──────────────────────────
//
// core 这边产出的是标签(do_not_break 里的床/门、垫路料标签……),少了它们规矩会静默失效:
// 她会拆主人的床、找不到任何可垫的方块,而日志里一句异常都没有。
// 与 api 那边同一条规矩:缺产物就把 datagen 拉进构建,别让空标签的包混出去。
// 条件取「不存在或空」:被中断的 datagen 会留下空目录,只判存在的话自动补跑不触发,
// 而把关那一步照样会拦 —— 于是每次构建都失败,却不肯自己跑一次 datagen。
// 同 api 侧:判据要问"东西在不在",不是"目录空不空"(被中断的 datagen 只剩 .cache/)。
def generatedReady = { -> file('src/generated/resources/data').isDirectory() }
// 依赖要给<b>惰性任务集合</b>,不能用 findByName:loom 与 ForgeGradle 各自在它们自己的
// afterEvaluate 里才注册 datagen 运行配置(名字还一家一个:runDatagen / Data),
// 而本脚本是 plugins{} 块里最先被应用的 —— 提前查必然拿到 null,补跑就静默失效。
// 集合形式的 dependsOn 到算任务图时才解析,名字对不对、注册得多晚都不影响。
if (!generatedReady()) {
    tasks.matching { it.name == 'jar' || it.name == 'remapJar' }.configureEach { t ->
        t.dependsOn(t.project.tasks.matching { d -> d.name == 'runDatagen' || d.name == 'Data' })
    }
}
tasks.named('jar', Jar) {
    doFirst {
        def generated = file('src/generated/resources')
        if (!generated.isDirectory() || !generated.listFiles()) {
            throw new GradleException("datagen 产物缺失(${generated}) —— 打出来的包里标签会是空的。"
                    + "先跑 `./gradlew datagenAll`,或重新执行本任务(缺产物时它会自动先跑 datagen)。")
        }
    }
}
